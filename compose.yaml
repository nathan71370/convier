services:
  convier:
    build:
      context: .
      dockerfile: Dockerfile
    image: convier:latest
    # Pas de container_name : Komodo nomme les conteneurs d'après le projet du
    # Stack. En figer un ici empêcherait de faire tourner deux instances
    # (prod et préprod, par exemple) sur le même serveur.
    restart: unless-stopped

    networks:
      - default
      - traefik

    # Pas de `ports:` : Traefik joint le conteneur par le réseau `traefik` sur
    # le port 3000. Publier ce port sur l'hôte exposerait l'app en HTTP clair,
    # à côté du HTTPS servi par le proxy.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.convier.rule=Host(`${CONVIER_HOST:-convier.limperiam.com}`)"
      - "traefik.http.routers.convier.entrypoints=websecure"
      - "traefik.http.routers.convier.tls=true"
      - "traefik.http.services.convier.loadbalancer.server.port=3000"

    environment:
      # Origine publique du site : liens montrés à l'organisateur et URL
      # inscrite dans le .ics. Dérivée du même hôte que la règle Traefik pour
      # que les deux ne puissent pas diverger.
      SITE_URL: ${SITE_URL:-https://${CONVIER_HOST:-convier.limperiam.com}}
      # Fichier SQLite local, relatif à /app. Pointe vers libsql://… avec
      # DATABASE_AUTH_TOKEN pour déporter les données sur Turso.
      DATABASE_URL: ${DATABASE_URL:-file:./data/local.db}
      # Sel des codes de connexion. Sans lui l'application refuse de démarrer,
      # plutôt que de hacher avec une valeur par défaut connue de tous.
      AUTH_SECRET: ${AUTH_SECRET:?génère-le avec openssl rand -hex 32}
      # Chemin DANS le conteneur, correspondant au montage ci-dessous.
      WHITELIST_FILE: ${WHITELIST_FILE:-/whitelist.txt}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}

    volumes:
      # Tout ce dont l'app se souvient vit ici. Sans ce volume, chaque
      # événement disparaît à la recréation du conteneur.
      - convier-data:/app/data
      # La liste des adresses autorisées, montée en lecture seule. Chemin ABSOLU
      # sur l'hôte, hors du dépôt : Komodo reclone le dépôt à chaque
      # déploiement, un chemin relatif y serait donc écrasé. Le même fichier
      # peut servir à plusieurs applications.
      #
      # Il doit exister AVANT le premier déploiement : Docker crée un
      # répertoire à la place d'un fichier absent, et l'app ne verrait jamais
      # d'adresse autorisée.
      - ${WHITELIST_HOST_FILE:?chemin absolu du fichier, ex. /srv/limperiam/whitelist.txt}:/whitelist.txt:ro

networks:
  default:
  traefik:
    external: true
    name: traefik

volumes:
  convier-data:
